<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keepsake Cards</title>
<meta name="description" content="Interactive 3D greeting cards for Tết, Christmas, New Year, anniversaries and birthdays.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f3ee; --surface: #fffdfa; --ink: #1d1714; --muted: #6f655e; --line: #e6ddd3;
    --accent: #b3261e; --chip: #efe8df; --shadow: 0 1px 2px rgba(40, 20, 10, .06), 0 8px 24px rgba(40, 20, 10, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #120e0c; --surface: #1c1613; --ink: #f3ece4; --muted: #a39990; --line: #2e2520;
      --accent: #f1cf77; --chip: #241c18; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 'Be Vietnam Pro', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 20px; }

  header.top { display: flex; align-items: center; justify-content: space-between; padding: 22px 0; }
  .brand { font: italic 500 22px 'Playfair Display', serif; color: var(--ink); text-decoration: none; }
  .brand span { color: var(--accent); }
  .top small { color: var(--muted); font-size: 13px; }

  .hero { padding: 48px 0 28px; text-align: center; }
  .hero h1 { margin: 0 auto; max-width: 14ch; text-wrap: balance; font: 600 clamp(34px, 6vw, 60px)/1.08 'Playfair Display', serif; letter-spacing: -.01em; }
  .hero h1 em { font-weight: 500; color: var(--accent); }
  .hero p { margin: 14px auto 0; max-width: 46ch; color: var(--muted); }

  .search { position: relative; max-width: 560px; margin: 30px auto 0; }
  .search svg { position: absolute; left: 18px; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 14px 52px 14px 46px; box-shadow: var(--shadow); outline: none; transition: border-color .2s;
  }
  .search input:focus { border-color: var(--accent); }
  .search kbd { position: absolute; right: 16px; top: 50%; translate: 0 -50%; font: 500 12px 'Be Vietnam Pro'; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
  .search input:focus + kbd { display: none; }

  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 22px 0 8px; }
  .chip {
    font: 500 14px 'Be Vietnam Pro'; color: var(--ink); background: var(--chip); border: 1px solid transparent; border-radius: 999px;
    padding: 7px 14px; cursor: pointer; transition: background .2s, color .2s;
  }
  .chip:hover { border-color: var(--line); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .chip b { font-weight: 500; opacity: .55; margin-left: 4px; }
  .chip:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  main { padding: 16px 0 72px; }
  section.cat { margin-top: 36px; }
  section.cat h2 { font: 600 22px 'Playfair Display', serif; margin: 0 0 14px; display: flex; align-items: baseline; gap: 10px; }
  section.cat h2 small { font: 400 13px 'Be Vietnam Pro'; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }

  .card { display: block; color: inherit; text-decoration: none; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); transition: transform .35s cubic-bezier(.2, .7, .2, 1), box-shadow .35s; }
  a.card:hover { transform: translateY(-4px); }
  .media { position: relative; aspect-ratio: 4 / 3; background: #1b1210; overflow: hidden; }
  .media img, .media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .media video { opacity: 0; transition: opacity .4s; }
  .card.playing video { opacity: 1; }
  .media .play { position: absolute; left: 12px; bottom: 12px; font: 500 12px 'Be Vietnam Pro'; color: #fff; background: rgba(0, 0, 0, .45); backdrop-filter: blur(6px); border-radius: 999px; padding: 4px 10px; transition: opacity .3s; }
  .card.playing .play { opacity: 0; }
  .art { position: absolute; inset: 0; display: grid; place-items: center; font-size: 72px; color: rgba(255, 255, 255, .85); }
  .art::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .18), transparent 55%); }
  .badge { position: absolute; top: 12px; right: 12px; font: 600 11px 'Be Vietnam Pro'; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: rgba(0, 0, 0, .35); border-radius: 999px; padding: 4px 10px; }
  .body { padding: 14px 16px 18px; }
  .body h3 { margin: 0; font: 600 18px 'Playfair Display', serif; display: flex; justify-content: space-between; gap: 8px; }
  .body h3 small { font: 400 13px 'Be Vietnam Pro'; color: var(--muted); white-space: nowrap; }
  .body p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
  .card.soon { opacity: .78; }
  .card.soon .body h3 { color: var(--muted); }

  .empty { text-align: center; color: var(--muted); padding: 48px 0; }
  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; padding: 22px 0 32px; }
  @media (prefers-reduced-motion: reduce) { .card, .media video { transition: none; } a.card:hover { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./">Keepsake<span>.</span></a>
    <small>Interactive 3D greeting cards</small>
  </header>

  <section class="hero">
    <h1>Greetings you can <em>step inside</em></h1>
    <p>Pick a template, add your photos and words, and send a card they'll explore, not just read.</p>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search templates: tết, snow, photos…" aria-label="Search templates" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Categories"></div>
  </section>

  <main id="results" aria-live="polite"></main>

  <footer>Hover a template to preview it. Open one to play the full card.</footer>
</div>

<script type="module">
// ponytail: the landing page never imports three.js. Each template is its own page with its own
// ES modules, so a template's code is only fetched when it's opened; hover plays a small video.
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase(); // "tet" finds "Tết"

const { categories, templates } = await fetch('templates.json').then(r => r.json());
const label = Object.fromEntries(categories.map(c => [c.id, c.label]));
for (const t of templates) t.hay = fold([t.title, t.description, label[t.category], ...(t.tags || [])].join(' '));

const params = new URLSearchParams(location.search);
const state = { q: params.get('q') || '', cat: params.get('cat') || 'all' };
if (state.cat !== 'all' && !label[state.cat]) state.cat = 'all';
$('#q').value = state.q;

function card(t) {
  const meta = t.length ? `<small>${esc(t.length)}</small>` : '';
  if (t.soon) return `
    <article class="card soon" aria-label="${esc(t.title)}, coming soon">
      <div class="media"><div class="art" style="background:linear-gradient(135deg,${esc(t.art.from)},${esc(t.art.to)})" aria-hidden="true">${esc(t.art.glyph)}</div><span class="badge">Coming soon</span></div>
      <div class="body"><h3>${esc(t.title)}</h3><p>${esc(t.description)}</p></div>
    </article>`;
  return `
    <a class="card" href="${esc(t.url)}">
      <div class="media">
        <img src="${esc(t.poster)}" alt="" loading="lazy" width="800" height="600">
        ${t.preview ? `<video data-src="${esc(t.preview)}" muted loop playsinline preload="none" aria-hidden="true"></video><span class="play">▶ Preview</span>` : ''}
      </div>
      <div class="body"><h3>${esc(t.title)}${meta}</h3><p>${esc(t.description)}</p></div>
    </a>`;
}

function render() {
  const words = fold(state.q).split(/\s+/).filter(Boolean);
  const hits = templates.filter(t => (state.cat === 'all' || t.category === state.cat) && words.every(w => t.hay.includes(w)));

  $('#chips').innerHTML = [{ id: 'all', label: 'All' }, ...categories].map(c => {
    const n = templates.filter(t => c.id === 'all' || t.category === c.id).length;
    return `<button class="chip" data-cat="${c.id}" aria-pressed="${state.cat === c.id}">${esc(c.label)}<b>${n}</b></button>`;
  }).join('');

  // Group by category, live templates first within each group.
  $('#results').innerHTML = categories
    .map(c => ({ c, list: hits.filter(t => t.category === c.id).sort((a, b) => !!a.soon - !!b.soon) }))
    .filter(g => g.list.length)
    .map(g => `<section class="cat"><h2>${esc(g.c.label)} <small>${g.list.length}</small></h2><div class="grid">${g.list.map(card).join('')}</div></section>`)
    .join('') || `<p class="empty">No templates match “${esc(state.q)}”. Try another word or category.</p>`;

  const url = new URLSearchParams();
  if (state.q) url.set('q', state.q);
  if (state.cat !== 'all') url.set('cat', state.cat);
  history.replaceState(null, '', url.size ? `?${url}` : location.pathname);
  wirePreviews();
}

// ---- previews: the video is only requested on first hover/focus (or when centred on touch screens)
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const touch = matchMedia('(hover: none)').matches;
function play(c) {
  const v = c.querySelector('video');
  if (!v.src) v.src = v.dataset.src;
  v.play().then(() => c.classList.add('playing')).catch(() => {});
}
function stop(c) {
  const v = c.querySelector('video');
  c.classList.remove('playing');
  v.pause();
  if (v.src) v.currentTime = 0;
}
const io = new IntersectionObserver(es => es.forEach(e => (e.isIntersecting ? play : stop)(e.target)), { threshold: 0.8 });
function wirePreviews() {
  if (reduced) return;
  io.disconnect();
  for (const c of document.querySelectorAll('a.card:has(video)')) {
    if (touch) { io.observe(c); continue; }
    c.addEventListener('pointerenter', () => play(c));
    c.addEventListener('pointerleave', () => stop(c));
    c.addEventListener('focus', () => play(c));
    c.addEventListener('blur', () => stop(c));
  }
}

$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); render(); });
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (b) { state.cat = b.dataset.cat; render(); $(`.chip[data-cat="${state.cat}"]`).focus(); }
});
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape' && document.activeElement === $('#q')) { $('#q').value = state.q = ''; render(); }
});
render();
</script>
</body>
</html>
