<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lì Xì Tết 2027</title>
<meta name="description" content="An interactive 3D Lunar New Year story: drift down a lantern river, open memories on a hoa mai tree, and receive a lì xì at dawn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root { --gold: #f1cf77; --ink: #fbeede; --bg: #0d0508; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; outline: none; }
  .fade { opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
  .fade.on { opacity: 1; }
  #header { position: fixed; top: 18px; left: 0; right: 0; text-align: center; padding: 0 16px; text-shadow: 0 1px 4px rgba(40, 8, 12, .9), 0 2px 18px rgba(0, 0, 0, .5); }
  #header h1 { margin: 0; font: italic 500 clamp(22px, 4vw, 34px) 'Playfair Display', serif; color: var(--gold); }
  #header p { margin: 4px 0 0; font-size: 12px; letter-spacing: .28em; text-transform: uppercase; opacity: .7; }
  #title { position: fixed; top: 12%; left: 0; right: 0; text-align: center; padding: 0 16px; text-shadow: 0 2px 6px rgba(40, 8, 12, .8), 0 2px 24px rgba(0, 0, 0, .6); }
  #title p { margin: 0 0 8px; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; opacity: .85; }
  #title h2 { margin: 0; font: italic 500 clamp(28px, 6vw, 56px) 'Playfair Display', serif; color: var(--gold); }
  #hint {
    position: fixed; bottom: 22px; left: 0; right: 0; text-align: center; pointer-events: none;
    font-size: 14px; letter-spacing: .06em; padding: 0 16px; text-shadow: 0 1px 8px rgba(0, 0, 0, .7);
  }
  body.nav #hint { bottom: 72px; } /* lift above the buttons only while they're shown */
  #hint span { display: inline-block; animation: nudge 1.6s ease-in-out infinite; margin-right: 6px; color: var(--gold); }
  @keyframes nudge { 50% { transform: translateY(-5px); } }
  nav { position: fixed; bottom: 18px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; padding: 0 16px; pointer-events: none; }
  button {
    pointer-events: auto; font: 600 13px 'Be Vietnam Pro', sans-serif; letter-spacing: .05em; color: var(--gold);
    background: rgba(40, 5, 8, .55); border: 1px solid rgba(241, 207, 119, .45); border-radius: 999px;
    padding: 9px 18px; cursor: pointer; backdrop-filter: blur(6px);
  }
  button[hidden] { display: none; }
  button:hover { background: rgba(90, 14, 20, .7); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #mute { position: fixed; top: 14px; right: 14px; z-index: 20; width: 44px; height: 44px; padding: 0; display: grid; place-items: center; }
  #mute svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #mute .off, #mute[aria-pressed="true"] .on { display: none; }
  #mute[aria-pressed="true"] .off { display: inline; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(ellipse at 50% 60%, #2a0b12 0%, var(--bg) 70%); color: var(--gold); padding: 16px; text-align: center;
    font: italic 500 20px 'Playfair Display', serif; transition: opacity 1.1s ease; z-index: 5;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .lantern { position: relative; width: 54px; height: 64px; border-radius: 45% 45% 42% 42% / 50%; transform-origin: 50% -30px; animation: sway 3.2s ease-in-out infinite;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 9px), radial-gradient(circle at 50% 55%, #ffcf7a, #e0461f 45%, #8a0d18 80%);
    box-shadow: 0 0 40px 8px rgba(255, 120, 50, .35), 0 0 120px 30px rgba(255, 90, 40, .12); }
  #loading .lantern::before, #loading .lantern::after { content: ""; position: absolute; left: 50%; translate: -50% 0; width: 26px; height: 6px; border-radius: 2px; background: #d9a843; }
  #loading .lantern::before { top: -4px; } #loading .lantern::after { bottom: -4px; }
  #loading .lantern i { position: absolute; left: 50%; bottom: -30px; translate: -50% 0; width: 3px; height: 24px; background: #c41628; border-radius: 2px; }
  #loading .lantern b { position: absolute; left: 50%; top: -30px; translate: -50% 0; width: 1px; height: 26px; background: rgba(241, 207, 119, .5); }
  @keyframes sway { 50% { rotate: 4deg; } 0%, 100% { rotate: -4deg; } }
  #loading .bar { width: min(220px, 60vw); height: 2px; background: rgba(241, 207, 119, .15); border-radius: 2px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(0); background: var(--gold); transition: transform .4s ease; box-shadow: 0 0 8px var(--gold); }
  #loading small { font: 400 12px 'Be Vietnam Pro', sans-serif; letter-spacing: .2em; text-transform: uppercase; opacity: .6; font-style: normal; }
  @media (prefers-reduced-motion: reduce) { #loading .lantern { animation: none; } }
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="Lunar New Year story. Press Enter to continue."></canvas>
<div id="title" class="fade" aria-live="polite"></div>
<div id="header" class="fade"><h1>Chúc Mừng Năm Mới</h1><p>Tết Đinh Mùi · 2027</p></div>
<div id="hint" aria-live="polite"></div>
<button id="mute" type="button" aria-pressed="false" aria-label="Mute sound">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/>
    <g class="on"><path d="M16 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.5 7a7 7 0 0 1 0 10"/></g>
    <g class="off"><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></g></svg>
</button>
<nav>
  <button id="skip" type="button" hidden>Skip to the courtyard</button>
  <button id="replay" type="button" hidden>Replay</button>
</nav>
<div id="loading" role="progressbar" aria-label="Loading the card" aria-valuemin="0" aria-valuemax="100">
  <div class="lantern" aria-hidden="true"><b></b><i></i></div>
  <div id="load-text">Đang mở thiệp…</div>
  <div class="bar"><i id="load-bar"></i></div>
  <small id="load-step">Loading</small>
</div>

<script>
// Loader: starts the story fetch in parallel with the modules, and drives the progress bar.
// main.js reports real milestones via __progress; until then the bar creeps toward 40%.
(() => {
  const id = new URLSearchParams(location.search).get('card') || 'demo';
  if (/^[\w-]{1,64}$/.test(id)) window.__storyReq = fetch(`stories/${id}/story.json`, { cache: 'no-cache' });
  const bar = document.getElementById('load-bar'), step = document.getElementById('load-step'), box = document.getElementById('loading');
  let p = 0;
  const set = (v) => { p = Math.max(p, v); bar.style.transform = `scaleX(${p})`; box.setAttribute('aria-valuenow', Math.round(p * 100)); };
  const creep = setInterval(() => set(p + (0.4 - p) * 0.06), 120);
  window.__progress = (v, label) => { if (v >= 0.4) clearInterval(creep); set(v); if (label) step.textContent = label; };
})();
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<!-- Flatten the module waterfall: fetch everything main.js will import, in parallel. -->

<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/objects/Reflector.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/utils/BufferGeometryUtils.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/EffectComposer.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/RenderPass.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/UnrealBloomPass.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/OutputPass.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/ShaderPass.js">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/postprocessing/Pass.js">
<link rel="modulepreload" href="js/tween.js">
<link rel="modulepreload" href="js/print.js">
<link rel="modulepreload" href="js/world.js">
<link rel="modulepreload" href="js/river.js">
<link rel="modulepreload" href="js/tree.js">
<link rel="modulepreload" href="js/popup.js">
<link rel="modulepreload" href="js/envelope.js">
<link rel="modulepreload" href="js/audio.js">

<link rel="modulepreload" href="js/arch.js">
<script type="module" src="js/main.js"></script>
</body>
</html>
