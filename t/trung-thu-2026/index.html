<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Trung Thu Tuổi Thơ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8F%AE%3C/text%3E%3C/svg%3E">
<meta name="description" content="An interactive 3D Mid-Autumn story: walk Hàng Mã street and make the festival toys, set the moon-watching tray on a Hanoi rooftop, join the lantern parade and the lion dance, then walk on the moon with Cuội.">

<style>
  :root { --gold: #f3d27e; --ink: #f6f0e4; --bg: #07081a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; outline: none; }
  .fade { opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
  .fade.on { opacity: 1; }
  #header { position: fixed; top: 18px; left: 0; right: 0; text-align: center; padding: 0 16px; text-shadow: 0 1px 4px rgba(8, 8, 30, .9), 0 2px 18px rgba(0, 0, 0, .5); }
  #header h1 { margin: 0; font: italic 500 clamp(22px, 4vw, 34px) 'Playfair Display', serif; color: var(--gold); }
  #header p { margin: 4px 0 0; font-size: 12px; letter-spacing: .28em; text-transform: uppercase; opacity: .7; }
  #title { position: fixed; top: 12%; left: 0; right: 0; text-align: center; padding: 0 16px; text-shadow: 0 2px 6px rgba(8, 8, 30, .8), 0 2px 24px rgba(0, 0, 0, .6); }
  #title p { margin: 0 0 8px; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; opacity: .85; }
  #title h2 { margin: 0; font: italic 500 clamp(28px, 6vw, 56px) 'Playfair Display', serif; color: var(--gold); }
  #hint {
    position: fixed; bottom: 22px; left: 0; right: 0; text-align: center; pointer-events: none;
    font-size: 14px; letter-spacing: .06em; padding: 0 16px; text-shadow: 0 1px 8px rgba(0, 0, 0, .7);
  }
  body.nav #hint { bottom: 72px; } /* lift above the buttons only while they're shown */
  #hint small { display: block; margin-top: 4px; font-size: 12px; opacity: .7; letter-spacing: .04em; }
  #hint span { display: inline-block; animation: nudge 1.6s ease-in-out infinite; margin-right: 6px; color: var(--gold); }
  @keyframes nudge { 50% { transform: translateY(-5px); } }
  nav { position: fixed; bottom: 18px; left: 0; right: 0; display: flex; justify-content: center; gap: 10px; padding: 0 16px; pointer-events: none; }
  button {
    pointer-events: auto; font: 600 13px 'Be Vietnam Pro', sans-serif; letter-spacing: .05em; color: var(--gold);
    background: rgba(12, 12, 40, .55); border: 1px solid rgba(241, 207, 119, .45); border-radius: 999px;
    padding: 9px 18px; cursor: pointer; backdrop-filter: blur(6px);
  }
  button[hidden] { display: none; }
  button:hover { background: rgba(40, 30, 90, .7); }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #mute { position: fixed; top: 14px; right: 14px; z-index: 20; width: 44px; height: 44px; padding: 0; display: grid; place-items: center; }
  /* start screen: begin, or pick a chapter from the chain */
  #start { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; padding: 16px; overflow-y: auto;
    background: radial-gradient(ellipse at 50% 45%, rgba(26, 26, 68, .55), rgba(7, 8, 26, .9) 75%); transition: opacity .7s ease; }
  #start.done { opacity: 0; pointer-events: none; }
  #start[hidden] { display: none; }
  #start .pane { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 100%; }
  #start h2 { margin: 0 0 8px; font: italic 500 clamp(30px, 6vw, 52px) 'Playfair Display', serif; color: var(--gold); }
  #start .sub { margin: 0; font-size: 13px; letter-spacing: .25em; text-transform: uppercase; opacity: .8; }
  #start .big { font-size: 15px; padding: 12px 26px; min-width: 240px; }
  #start .primary { background: var(--gold); color: #1a1030; }
  #start .langs { display: flex; gap: 8px; justify-content: center; margin: 6px 0 0; }
  #start .lang { font-size: 12px; padding: 7px 16px; opacity: .75; }
  #start .lang[aria-current] { opacity: 1; border-color: var(--gold); background: rgba(243, 210, 126, .18); }
  #start .map, #start.map .home { display: none; }
  #start.map .map { display: flex; }
  /* the chapters hang from one cord like paper lanterns on Hàng Mã: warm dó paper, ink, a thread each */
  .chain { list-style: none; margin: 8px 0; padding: 30px 0 0; display: flex; gap: 26px; position: relative; }
  .chain::before { content: ''; position: absolute; left: -24px; right: -24px; top: 6px; border-top: 1.5px solid rgba(243, 210, 126, .5); }
  .chain li { position: relative; }
  .chain li::before { content: ''; position: absolute; left: 50%; top: -24px; height: 24px; border-left: 1px solid rgba(243, 210, 126, .5); }
  .chain button { width: 176px; height: 100%; padding: 16px 16px 18px; border-radius: 3px; display: block; text-align: left; letter-spacing: 0;
    background: #f0e5cb; color: #2b2016; box-shadow: 0 12px 28px rgba(0, 0, 0, .4); transform-origin: 50% -24px; transition: transform .25s ease; }
  .chain li:nth-child(odd) button { transform: rotate(-1.2deg); }
  .chain li:nth-child(even) button { transform: rotate(.9deg); }
  .chain button:hover, .chain button:focus-visible { background: #f6ecd5; transform: none; }
  .chain .n { display: block; margin-bottom: 8px; font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #9a3b22; }
  .chain b, .chain small { display: block; }
  .chain b { margin-bottom: 6px; font: italic 600 20px/1.2 'Playfair Display', serif; color: #6e1f12; }
  .chain small { font-size: 12.5px; line-height: 1.5; color: #4a3b2c; }
  @media (max-width: 760px) {
    .chain { flex-direction: column; gap: 14px; padding: 0 0 0 22px; }
    .chain::before { left: 4px; right: auto; top: -8px; bottom: -8px; border-top: 0; border-left: 1.5px solid rgba(243, 210, 126, .5); }
    .chain li::before { left: -18px; top: 50%; width: 18px; height: 0; border-left: 0; border-top: 1px solid rgba(243, 210, 126, .5); }
    .chain li button, .chain li:nth-child(n) button { width: min(320px, calc(100vw - 64px)); transform: none; }
  }
  #mute svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #mute .off, #mute[aria-pressed="true"] .on { display: none; }
  #mute[aria-pressed="true"] .off { display: inline; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(ellipse at 50% 60%, #1a1a44 0%, var(--bg) 70%); color: var(--gold); padding: 16px; text-align: center;
    font: italic 500 20px 'Playfair Display', serif; transition: opacity 1.1s ease; z-index: 5;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .lantern { position: relative; width: 74px; height: 74px; transform-origin: 50% 110%; animation: sway 3.2s ease-in-out infinite;
    background: radial-gradient(circle at 50% 50%, #ffe08a, #ff6a2a 45%, #b3141f 80%); filter: drop-shadow(0 0 18px rgba(255, 120, 50, .6));
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  #loading .stick { position: absolute; left: 50%; top: calc(50% + 30px); width: 3px; height: 60px; background: #c8a060; border-radius: 2px; translate: -50% 0; }
  @keyframes sway { 50% { rotate: 4deg; } 0%, 100% { rotate: -4deg; } }
  #loading .bar { width: min(220px, 60vw); height: 2px; background: rgba(241, 207, 119, .15); border-radius: 2px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 100%; transform-origin: left; transform: scaleX(0); background: var(--gold); transition: transform .4s ease; box-shadow: 0 0 8px var(--gold); }
  #loading small { font: 400 12px 'Be Vietnam Pro', sans-serif; letter-spacing: .2em; text-transform: uppercase; opacity: .6; font-style: normal; }
  @media (prefers-reduced-motion: reduce) { #loading .lantern { animation: none; } }
  /* "Góc tìm hiểu": a sheet of điệp paper that slides up from the bottom */
  #fact, #memory { position: fixed; left: 50%; bottom: 16px; width: min(560px, calc(100% - 32px)); translate: -50% 30px; opacity: 0; pointer-events: none;
    transition: opacity .5s ease, translate .5s ease; z-index: 10; color: #2a1a10; }
  #fact.on, #memory.on { opacity: 1; translate: -50% 0; pointer-events: auto; }
  #fact { padding: 18px 20px 16px; border-radius: 14px; box-shadow: 0 10px 40px rgba(0, 0, 0, .45);
    background: radial-gradient(circle at 20% 10%, rgba(255, 255, 255, .5), transparent 40%), repeating-linear-gradient(115deg, rgba(160, 130, 90, .05) 0 2px, transparent 2px 6px), #f3e7cc;
    border: 1px solid #c9a86a; }
  /* the card always shows in full: on short screens the text gets smaller instead of scrolling */
  @media (max-height: 640px) { #fact { padding: 12px 16px 10px; } #fact h3 { font-size: 20px; margin: 2px 0 4px; } #fact p { font-size: 13px; line-height: 1.45; } #fact p.en { font-size: 12px; } #fact button { margin-top: 4px; } }
  @media (max-height: 460px) { #fact { width: min(760px, calc(100% - 32px)); } #fact p { font-size: 12px; line-height: 1.4; } #fact p.en { font-size: 11px; } }
  #fact .tag { margin: 0; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #9a2a1a; font-weight: 600; }
  #fact h3 { margin: 4px 0 8px; font: 600 clamp(20px, 4vw, 26px) 'Playfair Display', serif; color: #7a1a10; }
  #fact p { margin: 0 0 8px; font-size: 14.5px; line-height: 1.55; }
  #fact p.origin { display: inline-block; margin: -2px 0 10px; padding: 2px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: rgba(154, 42, 26, .1); color: #7a1a10; }
  #fact p.en { font-style: italic; font-size: 13px; opacity: .7; }
  #fact button, #memory button { display: block; margin: 10px 0 0 auto; color: #fff4d0; background: #9a1a14; border-color: #9a1a14; }
  #fact button:hover, #memory button:hover { background: #b8261c; }
  #memory .paper { background: #fbf6ea; padding: 12px 12px 10px; border-radius: 6px; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); rotate: -1deg; }
  #memory img { display: block; width: 100%; max-height: 42vh; object-fit: cover; border-radius: 3px; }
  #memory .date { margin: 10px 0 2px; font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: #9a2a1a; }
  #memory .cap { margin: 0; font: 600 20px 'Dancing Script', cursive; line-height: 1.35; }
  #memory .count { margin: 4px 0 0; font-size: 11px; opacity: .5; text-align: right; }
  #fade { position: fixed; inset: 0; background: #05060f; opacity: 0; pointer-events: none; transition: opacity .7s ease; z-index: 8; }
  #fade.on { opacity: 1; }
  #maskview { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity .35s ease; z-index: 3; }
  #maskview.on { opacity: 1; }
  #hint b { color: var(--gold); font-weight: 600; }
  /* "Cả hai · Both": the English rides under the Vietnamese, in italic */
  .en { font-style: italic; opacity: .78; }
  #title p.en { margin: 8px 0 0; font: italic 500 clamp(15px, 2.6vw, 22px) 'Playfair Display', serif;
    letter-spacing: .02em; text-transform: none; opacity: .82; color: var(--ink); }
  .chain .en { display: block; margin-top: 3px; color: #6b5a47; }
  #fact .gloss { margin: -4px 0 8px; font: italic 14px 'Playfair Display', serif; color: #8a4a2a; }
  #final { position: fixed; top: 9%; left: 50%; translate: -50% 20px; width: min(620px, calc(100% - 32px)); text-align: center; opacity: 0; transition: opacity 2.4s ease, translate 2.4s ease;
    pointer-events: none; text-shadow: 0 2px 10px rgba(5, 8, 30, .95), 0 0 30px rgba(5, 8, 30, .7); z-index: 4;
    padding: 22px 28px; border-radius: 40px; background: radial-gradient(closest-side, rgba(5, 8, 30, .62), rgba(5, 8, 30, .38) 70%, transparent); }
  #final.on { opacity: 1; translate: -50% 0; }
  #final .to { margin: 0 0 10px; font-size: 13px; letter-spacing: .3em; text-transform: uppercase; opacity: .85; }
  #final .msg { margin: 0; font: 600 clamp(24px, 4.6vw, 38px) 'Dancing Script', cursive; line-height: 1.35; color: #fff4d8; }
  #final .from { margin: 14px 0 0; font: italic 500 18px 'Playfair Display', serif; color: var(--gold); }
  #final .from::before { content: '— '; }

<body>
<canvas id="scene" tabindex="0" aria-label="Mid-Autumn story. Drag or use the arrow keys to look around; press Enter to continue."></canvas>
<div id="title" class="fade" aria-live="polite"></div>
<div id="header" class="fade"><h1>Trung Thu Vui Vẻ</h1><p>Rằm tháng Tám · 2026</p></div>
<div id="hint" aria-live="polite"></div>
<button id="mute" type="button" aria-pressed="false" aria-label="Mute sound">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor" stroke="none"/>
    <g class="on"><path d="M16 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18.5 7a7 7 0 0 1 0 10"/></g>
    <g class="off"><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></g></svg>
</button>
<section id="start" hidden aria-label="Start"></section>
<canvas id="maskview" aria-hidden="true"></canvas>
<nav>
  <button id="next" type="button" hidden>Continue →</button>
  <button id="replay" type="button" hidden>Replay</button>
</nav>
<section id="fact" aria-live="polite" aria-hidden="true"></section>
<section id="memory" aria-live="polite"></section>
<div id="fade"></div>
<div id="final" aria-live="polite"></div>
<div id="loading" role="progressbar" aria-label="Loading the card" aria-valuemin="0" aria-valuemax="100">
  <div style="position:relative" aria-hidden="true"><div class="lantern"></div><i class="stick"></i></div>
  <div id="load-text"></div>
  <div class="bar"><i id="load-bar"></i></div>
  <small id="load-step">Loading</small>
</div>

<script>
// Loader: starts the story fetch in parallel with the modules, and drives the progress bar.
// main.js reports real milestones via __progress; until then the bar creeps toward 40%.
(() => {
  const q = new URLSearchParams(location.search);
  // The loader draws before any module has parsed, so it works the language out for itself; js/lang.js agrees.
  let lg = q.get('lang');
  try { lg = lg || localStorage.getItem('keepsake-lang'); } catch {}
  if (lg !== 'vi' && lg !== 'en') lg = navigator.language && navigator.language.startsWith('vi') ? 'vi' : 'en';
  document.documentElement.lang = lg;
  document.getElementById('load-text').textContent = lg === 'vi' ? 'Đang thắp đèn…' : 'Lighting the lanterns…';
  document.getElementById('load-step').textContent = lg === 'vi' ? 'Đang tải' : 'Loading';
  const id = q.get('card') || 'demo';
  if (/^[\w-]{1,64}$/.test(id)) window.__storyReq = fetch(`stories/${id}/story.json`, { cache: 'no-cache' });
  const bar = document.getElementById('load-bar'), step = document.getElementById('load-step'), box = document.getElementById('loading');
  let p = 0;
  const set = (v) => { p = Math.max(p, v); bar.style.transform = `scaleX(${p})`; box.setAttribute('aria-valuenow', Math.round(p * 100)); };
  const creep = setInterval(() => set(p + (0.4 - p) * 0.06), 120);
  window.__progress = (v, label) => { if (v >= 0.4) clearInterval(creep); set(v); if (label) step.textContent = label; };
  // Show load failures on screen (phones have no console): a module that fails to fetch or parse never reports progress.
  let failed = false;
  const fail = (m) => { if (!failed && box.isConnected && !window.__loaded) { failed = true; step.style.cssText = 'text-transform:none;letter-spacing:0;opacity:1;max-width:90vw'; step.textContent = 'Error: ' + m; } };
  // On failure, import each module on its own: the rejection names the file and the real error (syntax, missing export…).
  let diagRan = false;
  const diag = () => {
    if (diagRan) return; diagRan = true;
    const mods = ['three', 'lang', 'tween', 'print', 'tex', 'arch', 'street', 'world', 'lanterns', 'figures', 'rig', 'audio', 'ui', 'facts', 'hangma', 'stops', 'trees', 'roof', 'pomelo', 'keoquan', 'lion', 'dinh', 'moonworld', 'main'];
    Promise.all(mods.map((m) => import(m === 'three' ? m : './js/' + m + '.js').then(() => null, (e) => m + ': ' + (e && e.name) + ' ' + (e && e.message))))
      .then((r) => { const bad = r.filter(Boolean); step.textContent += ' · ' + (bad.length ? bad.join(' | ') : 'all modules import fine') + ' · ' + navigator.userAgent.replace(/^.*?\(|\).*$/g, ''); });
  };
  addEventListener('error', (e) => {
    const t = e.target, tag = t && t.tagName;
    // only scripts and module preloads stop the card; a missing photo or sound is not fatal
    if (window.__loaded || (tag && tag !== 'SCRIPT' && !(tag === 'LINK' && t.rel === 'modulepreload'))) return;
    fail(e.message || (e.target && (e.target.src || e.target.href)) || 'resource failed'); diag(); }, true);
  addEventListener('unhandledrejection', (e) => fail(String(e.reason && (e.reason.stack || e.reason.message) || e.reason)));
  setTimeout(() => { if (p < 0.45) fail('still waiting for the scripts after 30 s (' + navigator.userAgent + ')'); }, 30000);
})();
</script>
